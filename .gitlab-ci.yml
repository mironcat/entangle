stages:
  - container
  - style
  - build

.container-job-template: &container-job-definition
  image: docker:stable
  stage: container
  services:
    - docker:dind
  before_script:
    - docker info
    - docker login registry.gitlab.com -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD}
    - export TAG="${CI_REGISTRY_IMAGE}/${NAME}:${CI_COMMIT_REF_SLUG}"
  script:
    - docker pull ${TAG} || true
    - docker build --tag ${TAG} --cache-from ${TAG} -f ci/${NAME}.docker ci
    - docker push ${TAG}
  after_script:
    - docker logout

.build-job-template: &build-job-definition
  stage: build
  script:
    - meson --prefix="`pwd`/vroot" -Denable-gtk-doc=true build
    - ninja -C build dist
    - if [ test -f /usr/bin/rpmbuild ]; then rpmbuild --nodeps --define "_sourcedir `pwd`" -ta --clean entangle*.tar.xz ; fi

container-build-fedora31:
  <<: *container-job-definition
  variables:
    NAME: build-fedora31

container-build-ubuntu2004:
  <<: *container-job-definition
  variables:
    NAME: build-ubuntu2004

build-fedora31:
  <<: *build-job-definition
  image: ${CI_REGISTRY_IMAGE}/build-fedora31:${CI_COMMIT_REF_SLUG}

build-ubuntu2004:
  <<: *build-job-definition
  image: ${CI_REGISTRY_IMAGE}/build-ubuntu2004:${CI_COMMIT_REF_SLUG}

syntax-check:
  stage: style
  image: ${CI_REGISTRY_IMAGE}/build-fedora31:${CI_COMMIT_REF_SLUG}
  script:
    - make syntax-check

clang-format:
  stage: style
  image: ${CI_REGISTRY_IMAGE}/build-fedora31:${CI_COMMIT_REF_SLUG}
  script:
    - meson build
    - ninja -C build clang-format
    - if git diff --patch --exit-code > clang-format.patch; then echo "Clang format changed nothing"; else echo "Clang format found changes to make!"; false; fi
  artifacts:
    paths:
      - clang-format.patch
    expire_in: 1 week
    when: on_failure
