stages:
  - container
  - style
  - build

.base-job:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $RUN_PIPELINE != "1"'
      when: never
    - when: on_success

.container-job:
  extends: .base-job
  image: docker:latest
  stage: container
  services:
    - docker:dind
  before_script:
    - export TAG="$CI_REGISTRY_IMAGE/$NAME:latest"
    - export COMMON_TAG="$CI_REGISTRY/entangle/entangle/$NAME:latest"
    - docker info
    - docker login registry.gitlab.com -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
  script:
    - docker pull "$TAG" || docker pull "$COMMON_TAG" || true
    - docker build --cache-from "$TAG" --cache-from "$COMMON_TAG" --tag "$TAG" -f "ci/$NAME.docker" ci
    - docker push "$TAG"
  after_script:
    - docker logout

.build-job:
  extends: .base-job
  image: ${CI_REGISTRY_IMAGE}/${NAME}:latest
  stage: build
  script:
    - meson --prefix="`pwd`/vroot" -Denable-gtk-doc=true build
    - ninja -C build dist
    - if [ test -f /usr/bin/rpmbuild ]; then rpmbuild --nodeps --define "_sourcedir `pwd`" -ta --clean entangle*.tar.xz ; fi

.style-job:
  extends: .base-job
  stage: style

container-build-fedora:
  extends: .container-job
  variables:
    NAME: build-fedora

container-build-ubuntu:
  extends: .container-job
  variables:
    NAME: build-ubuntu

build-fedora:
  extends: .build-job
  needs:
    - job: container-build-fedora
  variables:
    NAME: build-fedora

build-ubuntu:
  extends: .build-job
  needs:
    - job: container-build-ubuntu
  variables:
    NAME: build-ubuntu

syntax-check:
  extends: .style-job
  needs:
    - job: container-build-fedora
  image: ${CI_REGISTRY_IMAGE}/build-fedora:latest
  script:
    - make syntax-check

clang-format:
  extends: .style-job
  needs:
    - job: container-build-fedora
  image: ${CI_REGISTRY_IMAGE}/build-fedora:latest
  script:
    - meson build
    - ninja -C build clang-format
    - if git diff --patch --exit-code > clang-format.patch; then echo "Clang format changed nothing"; else echo "Clang format found changes to make!"; false; fi
  artifacts:
    paths:
      - clang-format.patch
    expire_in: 1 week
    when: on_failure
