stages:
  - container
  - style
  - build

.container-job-template: &container-job-definition
  image: docker:stable
  stage: container
  services:
    - docker:dind
  before_script:
    - export TAG="$CI_REGISTRY_IMAGE/$NAME:latest"
    - export COMMON_TAG="$CI_REGISTRY/entangle/entangle/$NAME:latest"
    - docker info
    - docker login registry.gitlab.com -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
  script:
    - docker pull "$TAG" || docker pull "$COMMON_TAG" || true
    - docker build --cache-from "$TAG" --cache-from "$COMMON_TAG" --tag "$TAG" -f "ci/$NAME.docker" ci
    - docker push "$TAG"
  after_script:
    - docker logout

.build-job-template: &build-job-definition
  image: ${CI_REGISTRY_IMAGE}/${NAME}:latest
  stage: build
  script:
    - meson --prefix="`pwd`/vroot" -Denable-gtk-doc=true build
    - ninja -C build dist
    - if [ test -f /usr/bin/rpmbuild ]; then rpmbuild --nodeps --define "_sourcedir `pwd`" -ta --clean entangle*.tar.xz ; fi

container-build-fedora31:
  <<: *container-job-definition
  variables:
    NAME: build-fedora31

container-build-ubuntu2004:
  <<: *container-job-definition
  variables:
    NAME: build-ubuntu2004

build-fedora31:
  <<: *build-job-definition
  variables:
    NAME: build-fedora31

build-ubuntu2004:
  <<: *build-job-definition
  variables:
    NAME: build-ubuntu2004

syntax-check:
  stage: style
  image: ${CI_REGISTRY_IMAGE}/build-fedora31:latest
  script:
    - make syntax-check

clang-format:
  stage: style
  image: ${CI_REGISTRY_IMAGE}/build-fedora31:latest
  script:
    - meson build
    - ninja -C build clang-format
    - if git diff --patch --exit-code > clang-format.patch; then echo "Clang format changed nothing"; else echo "Clang format found changes to make!"; false; fi
  artifacts:
    paths:
      - clang-format.patch
    expire_in: 1 week
    when: on_failure
